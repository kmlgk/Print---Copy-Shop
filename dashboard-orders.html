<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders | Sharpline Print &amp; Copy Co.</title>
<meta name="description" content="View your Sharpline order history, track job status, and reorder past prints without re-uploading." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234338CA'/%3E%3Cpath d='M7 8V4h10v4M6 17H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='7' y='13' width='10' height='7' fill='white'/%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var theme = localStorage.getItem('sharpline-theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('dir', localStorage.getItem('sharpline-dir') || 'ltr');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-area="dashboard" data-page="orders" data-page-title="My Orders">
<div id="toast-root"></div>
<div id="dash-sidebar-root"></div>

<div class="lg:ps-72 min-h-screen flex flex-col">
  <div id="dash-topbar-root"></div>

  <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="font-display text-2xl sm:text-3xl">MY ORDERS</h1>
          <p class="text-sm mt-1" style="color:var(--text-muted)">Track every job and reorder without re-uploading.</p>
        </div>
        <a href="dashboard-new-order.html" class="btn btn-primary btn-sm">+ New Print Job</a>
      </div>

      <div class="flex gap-2 overflow-x-auto pb-1 mb-6">
        <button type="button" class="filter-btn is-active-tab shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="all">All</button>
        <button type="button" class="filter-btn shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="received">Received</button>
        <button type="button" class="filter-btn shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="processing">Processing</button>
        <button type="button" class="filter-btn shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="printing">Printing</button>
        <button type="button" class="filter-btn shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="ready">Ready for Pickup</button>
        <button type="button" class="filter-btn shrink-0 px-4 py-2 rounded-full border text-sm font-medium" style="border-color:var(--border)" data-order-filter="picked_up">Picked Up</button>
      </div>

      <div id="orders-list" class="space-y-4"></div>
    </div>
  </main>
</div>

<script src="assets/js/main.js" defer></script>
<script src="assets/js/dashboard.js" defer></script>
</body>
</html>
