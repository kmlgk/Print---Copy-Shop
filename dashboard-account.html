<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Settings | Sharpline Print &amp; Copy Co.</title>
<meta name="description" content="Update your Sharpline profile details and password." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234338CA'/%3E%3Cpath d='M7 8V4h10v4M6 17H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='7' y='13' width='10' height='7' fill='white'/%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var theme = localStorage.getItem('sharpline-theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('dir', localStorage.getItem('sharpline-dir') || 'ltr');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .field-input{width:100%;padding:.7rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text)}
  .field-input:focus{outline:none;border-color:var(--c-blue-600);box-shadow:0 0 0 3px rgba(67,56,202,.15)}
  .field-label{font-size:.85rem;font-weight:600;margin-bottom:.4rem;display:block}
  .field-error{color:var(--c-magenta-600);font-size:.78rem;margin-top:.35rem}
</style>
</head>
<body data-area="dashboard" data-page="account" data-page-title="Account Settings">
<div id="toast-root"></div>
<div id="dash-sidebar-root"></div>

<div class="lg:ps-72 min-h-screen flex flex-col">
  <div id="dash-topbar-root"></div>

  <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-3xl mx-auto">
      <h1 class="font-display text-2xl sm:text-3xl mb-1">ACCOUNT SETTINGS</h1>
      <p class="text-sm mb-8" style="color:var(--text-muted)">Update your profile details and password.</p>

      <form id="account-form" class="ticket-card p-6 sm:p-8 space-y-5 mb-8" novalidate>
        <span class="ticket-clip" aria-hidden="true"></span>
        <h2 class="font-display text-lg mb-2">PROFILE</h2>
        <div class="grid sm:grid-cols-2 gap-5">
          <div>
            <label class="field-label" for="account-name">Full name</label>
            <input class="field-input" type="text" id="account-name" name="fullName" data-validate="required|min:2" />
            <p class="field-error hidden" data-error-for="fullName">Please enter your name.</p>
          </div>
          <div>
            <label class="field-label" for="account-email">Email address</label>
            <input class="field-input" type="email" id="account-email" name="email" data-validate="required|email" />
            <p class="field-error hidden" data-error-for="email">Please enter a valid email.</p>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </form>

      <form id="password-form" class="ticket-card p-6 sm:p-8 space-y-5" novalidate>
        <span class="ticket-clip" aria-hidden="true"></span>
        <h2 class="font-display text-lg mb-2">PASSWORD</h2>
        <div class="grid sm:grid-cols-2 gap-5">
          <div>
            <label class="field-label" for="new-password">New password</label>
            <input class="field-input" type="password" id="new-password" name="newPassword" data-validate="required|min:6" />
            <p class="field-error hidden" data-error-for="newPassword">Password must be at least 6 characters.</p>
          </div>
          <div>
            <label class="field-label" for="confirm-password">Confirm new password</label>
            <input class="field-input" type="password" id="confirm-password" name="confirmPassword" data-validate="required" />
            <p class="field-error hidden" data-error-for="confirmPassword">Passwords do not match.</p>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </main>
</div>

<script src="assets/js/main.js" defer></script>
<script src="assets/js/dashboard.js" defer></script>
</body>
</html>
